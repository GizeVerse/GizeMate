# The Android app's own version (1.6.0, release candidate). The Android app and the desktop and
# web version (package.json) are released together (1.6.0 is the GizeMate multi-character release). The file
# stays the single source for the Android versionName and versionCode (docs/platforms/android-overlay.md,
# "Version"), so a later Android-only update can again move ahead of package.json.
#
# versionName   shown to users, and the version of the bundled web app's About line.
# versionCode   must increase with every APK anyone can install over an earlier one. The earlier trial APKs
#               were 10400 (1.4.0), 10401 (1.4.0-overlay.1), 10402 (1.4.1), 10403 (1.4.2) and 10500 (1.5.0, built for the owner, never published for Android); this one is
#               10600 (MAJOR*10000 + MINOR*100 + PATCH, the floor the Gradle build enforces from
#               package.json). Never lower it, and never reuse a value.
versionName=1.6.0
versionCode=10600
