<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self'; manifest-src 'self'; worker-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none'" />
    <meta name="referrer" content="no-referrer" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f6f1e7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#1b1814" media="(prefers-color-scheme: dark)" />
    <meta name="description" content="GizeMate, a GizeVerse companion: a small animated friend to pet, pick up and keep you company." />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="GizeMate" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>GizeMate</title>
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png" />
    <link rel="stylesheet" href="web.css" />
    <script type="module" src="main.js"></script>
  </head>
  <body>
    <h1 class="visually-hidden">GizeMate</h1>
    <!-- The first screen, CSS only (web.css; the page allows no inline script): main.js removes it when
         the companion starts. If that never happens (the script could not load, or the browser is too old to
         run it) the stylesheet replaces the waiting message with the failure message by itself. -->
    <div id="boot" class="boot" role="status">
      <div class="boot-wait">
        <span class="boot-spinner" aria-hidden="true"></span>
        <p id="boot-wait-text">GizeMate is waking up.</p>
      </div>
      <p class="boot-failed">GizeMate has not started. If it stays like this, check your connection and open it again. GizeMate needs an up-to-date browser.<br /><span lang="tr">GizeMate başlamadı. Böyle kalırsa bağlantınızı kontrol edip yeniden açın. GizeMate için güncel bir tarayıcı gerekir.</span></p>
    </div>
    <header class="bar">
      <div class="controls" id="controls" role="group" aria-label="Companion controls">
        <button type="button" id="btn-call">Call</button>
        <button type="button" id="btn-sleep">Sleep</button>
        <button type="button" id="btn-pause">Pause</button>
        <button type="button" id="btn-sound">Turn sound on</button>
        <button type="button" id="btn-settings" aria-haspopup="dialog" aria-controls="settings">Settings</button>
        <!-- The Android app's home panel (androidPanel.ts) opens from here; hidden everywhere else. -->
        <button type="button" id="btn-panel" hidden>Panel</button>
      </div>
    </header>
    <p id="cat-status" class="visually-hidden" role="status" aria-live="polite"></p>
    <noscript><p class="noscript">GizeMate needs JavaScript to run here.<br /><span lang="tr">GizeMate'in çalışması için JavaScript gerekir.</span></p></noscript>
    <!-- Filled by src/web/settingsPanel.ts (About, privacy, storage and install notes live there). -->
    <dialog id="settings" class="sheet" aria-labelledby="settings-title"></dialog>
    <!-- Measures env(safe-area-inset-*) for src/web/safeArea.ts; never visible. -->
    <div id="safe-area-probe" aria-hidden="true"></div>
    <canvas id="cat" aria-hidden="true"></canvas>
  </body>
</html>
